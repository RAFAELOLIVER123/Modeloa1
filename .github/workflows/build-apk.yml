name: Build DamaCub APK
on:
  push:
    branches: [ damacub-build ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Apply DamaCub 4.2 gameplay patch
        run: python3 tools/patch42.py
      - name: Validate JavaScript syntax
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('app/src/main/assets/game.html','utf8');
          const m=s.match(/<script>([\s\S]*?)<\/script>/);
          if(!m) throw new Error('script nao encontrado');
          new Function(m[1]);
          console.log('JavaScript OK');
          NODE
      - name: Validate gameplay requirements
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('app/src/main/assets/game.html').read_text()
          assert 'function captureOptions' in s
          assert 'musicBeat' in s
          assert "width:min(98vw,900px,calc(100vh - 12px))" in s
          lv=s[s.index('function setLevel('):s.index('function showHint(')]
          assert 'newGame' not in lv
          g=Path('app/build.gradle').read_text()
          assert 'versionCode 6' in g and "versionName '4.2'" in g
          assert 'ca-app-pub-8790498111791129/6529171280' in g
          print('DamaCub 4.2 checks OK')
          PY
      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace
      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: DamaCub-4.2-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
