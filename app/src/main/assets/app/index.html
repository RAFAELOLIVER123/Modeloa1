<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#ffffff">
  <title>AgroDominium</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="style-v23.css">
  <link rel="stylesheet" href="style-v228.css?v=228">
  <link rel="stylesheet" href="style-v229.css?v=229">
  <link rel="stylesheet" href="style-v230.css?v=230">
  <style>
    .login-card{padding-top:42px!important;padding-bottom:30px!important}
    .login-logo{margin:0 auto 34px!important}
    .login-card label{margin-top:18px!important}
    .login-card>small{display:block;text-align:center;margin-top:18px;line-height:1.45}
  </style>
</head>
<body>
<div id="app" class="app-shell">
  <header class="topbar">
    <div class="brandmark" aria-hidden="true">
      <svg viewBox="0 0 128 128"><path d="M62 96c0-20 2-35 5-46" fill="none" stroke="#0e6b45" stroke-width="8" stroke-linecap="round"/><path d="M66 54c-18 0-30-11-31-29 18-2 33 7 36 24-1 2-3 4-5 5Z" fill="#79a63b"/><path d="M70 68c3-20 17-31 37-28-1 20-13 33-33 34-2-2-3-4-4-6Z" fill="#0e6b45"/><path d="M64 97h24" fill="none" stroke="#0e6b45" stroke-width="8" stroke-linecap="round"/></svg>
    </div>
    <div class="brandtext"><strong>AgroDominium</strong><small id="subtitle">Campo offline</small></div>
    <div class="top-actions"><button id="netChip" class="chip offline" type="button">Offline</button><button class="icon-btn" type="button" onclick="syncNow()" aria-label="Sincronizar">↻</button></div>
  </header>
  <main id="screen" class="screen"></main>
  <nav class="bottom-nav">
    <button data-tab="home" onclick="nav('home')"><span>⌂</span><b>Campo</b></button>
    <button data-tab="agenda" onclick="nav('agenda')"><span>▣</span><b>Agenda</b></button>
    <button class="add-main" data-tab="add" onclick="nav('add')"><span>＋</span><b>Adicionar</b></button>
    <button data-tab="map" onclick="nav('map')"><span>⌖</span><b>Mapa</b></button>
    <button data-tab="profile" onclick="nav('profile')"><span>♙</span><b>Perfil</b></button>
  </nav>
</div>
<div id="loginOverlay" class="login-overlay hidden">
  <div class="login-card">
    <div class="login-logo">
      <svg viewBox="0 0 128 128"><path d="M62 96c0-20 2-35 5-46" fill="none" stroke="#0e6b45" stroke-width="8" stroke-linecap="round"/><path d="M66 54c-18 0-30-11-31-29 18-2 33 7 36 24-1 2-3 4-5 5Z" fill="#79a63b"/><path d="M70 68c3-20 17-31 37-28-1 20-13 33-33 34-2-2-3-4-4-6Z" fill="#0e6b45"/><path d="M64 97h24" fill="none" stroke="#0e6b45" stroke-width="8" stroke-linecap="round"/></svg>
    </div>
    <label>Usuário, e-mail ou matrícula<input id="loginUser" autocomplete="username" placeholder="Seu acesso"></label>
    <label>Senha<input id="loginPass" type="password" autocomplete="current-password" placeholder="••••••••"></label>
    <button id="loginBtn" type="button" class="btn primary full" onclick="doLogin()">Entrar</button>
    <small>Os dados já salvos no aparelho não são apagados durante a atualização.</small>
  </div>
</div>
<div id="toast" class="toast"></div>
<script src="app.js?v=226"></script>
<script src="fix-v226.js?v=226"></script>
<script src="fix-v228.js?v=228"></script>
<script src="fix-v229.js?v=229"></script>
<script src="fix-v230a.js?v=230"></script>
</body>
</html>
