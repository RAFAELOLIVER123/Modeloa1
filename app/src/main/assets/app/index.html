<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#ffffff">
  <title>AgroDominium</title>
  <link rel="stylesheet" href="style-v23.css">
</head>
<body>
<div id="app" class="app-shell">
  <header class="topbar">
    <div class="brandmark" aria-hidden="true">
      <svg viewBox="0 0 128 128"><path d="M62 96c0-20 2-35 5-46" fill="none" stroke="#0e6b45" stroke-width="8" stroke-linecap="round"/><path d="M66 54c-18 0-30-11-31-29 18-2 33 7 36 24-1 2-3 4-5 5Z" fill="#79a63b"/><path d="M70 68c3-20 17-31 37-28-1 20-13 33-33 34-2-2-3-4-4-6Z" fill="#0e6b45"/><path d="M64 97h24" fill="none" stroke="#0e6b45" stroke-width="8" stroke-linecap="round"/></svg>
    </div>
    <div class="brandtext"><strong>AgroDominium</strong><small id="subtitle">Campo offline</small></div>
    <div class="top-actions"><button id="netChip" class="chip offline" type="button" onclick="syncScreen()">Offline</button><button class="icon-btn" type="button" onclick="syncBoth()" aria-label="Sincronizar">↻</button></div>
  </header>
  <main id="screen" class="screen"></main>
  <nav class="bottom-nav">
    <button data-tab="home" onclick="nav('home')"><span>⌂</span><b>Campo</b></button>
    <button data-tab="agenda" onclick="nav('agenda')"><span>▣</span><b>Agenda</b></button>
    <button class="add-main" data-tab="add" onclick="nav('add')"><span>＋</span><b>Adicionar</b></button>
    <button data-tab="map" onclick="nav('map')"><span>⌖</span><b>Mapa</b></button>
    <button data-tab="profile" onclick="nav('profile')"><span>♙</span><b>Perfil</b></button>
  </nav>
</div>
<div id="loginOverlay" class="login-overlay hidden">
  <div class="login-card">
    <div class="login-logo"><svg viewBox="0 0 128 128"><path d="M62 96c0-20 2-35 5-46" fill="none" stroke="#0e6b45" stroke-width="8" stroke-linecap="round"/><path d="M66 54c-18 0-30-11-31-29 18-2 33 7 36 24-1 2-3 4-5 5Z" fill="#79a63b"/><path d="M70 68c3-20 17-31 37-28-1 20-13 33-33 34-2-2-3-4-4-6Z" fill="#0e6b45"/><path d="M64 97h24" fill="none" stroke="#0e6b45" stroke-width="8" stroke-linecap="round"/></svg></div>
    <h1>AgroDominium</h1>
    <p>Entre uma vez com internet. Depois, GPS, fotos, rotas e coletas continuam funcionando offline.</p>
    <label>Usuário, e-mail ou matrícula<input id="loginUser" autocomplete="username" placeholder="Seu acesso"></label>
    <label>Senha<input id="loginPass" type="password" autocomplete="current-password" placeholder="••••••••"></label>
    <button id="loginBtn" class="btn primary full" onclick="doLogin()">Entrar</button>
    <small>Se já houver uma base baixada neste aparelho, ela continuará preservada.</small>
  </div>
</div>
<div id="toast" class="toast"></div>
<script src="app-v23.js"></script>
</body>
</html>
