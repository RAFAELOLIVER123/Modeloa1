plugins {
    id 'com.android.application'
}

android {
    namespace 'com.paf.gestaooperacional'
    compileSdk 35

    defaultConfig {
        applicationId 'com.paf.gestaooperacional'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.debug
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
}
